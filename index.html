
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JQuake Mini Overlay</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1100px;height:360px;overflow:hidden;background:transparent;font-family:Arial,"Noto Sans JP",sans-serif;color:#f3f8ff}
body{padding:5px}
main{height:310px;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:9px}
.panel{background:rgba(8,27,48,.94);border:1px solid #3982b5;border-radius:10px;padding:10px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
h2{font-size:19px;color:#79d8ff;margin:0 0 8px;white-space:nowrap}
.content{overflow-y:auto;min-height:0;flex:1;padding-right:4px}
.item{padding:7px 2px;border-bottom:1px solid #34516b;font-size:15px;line-height:1.35}
.sub{font-size:11px;color:#a9bfd6;margin-top:3px}
.pill{display:inline-block;background:#18527c;border-radius:5px;padding:3px 6px;font-size:12px}
.weathergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.weather{background:#163957;border-radius:6px;padding:5px;min-width:0}
.pref{font-size:11px;color:#b8d1e8;white-space:nowrap}
.temp{font-size:18px;font-weight:bold;margin-top:2px}
.condition{font-size:10px;color:#b8d1e8}
footer{height:38px;margin-top:5px;background:rgba(10,45,75,.96);border:1px solid #3982b5;border-radius:8px;display:flex;align-items:center;overflow:hidden}
.label{background:#17649b;padding:8px 10px;font-size:14px;font-weight:bold;white-space:nowrap}
.tickerWindow{flex:1;overflow:hidden;white-space:nowrap}
.ticker{display:inline-block;padding-left:100%;font-size:16px;animation:move 25s linear infinite}
@keyframes move{from{transform:translateX(0)}to{transform:translateX(-100%)}}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#397ba8;border-radius:5px}
</style>
</head>
<body>
<main>
<section class="panel">
<h2>● 地震情報</h2>
<div class="content" id="quakes">地震情報を取得中...</div>
</section>

<section class="panel">
<h2>● 全国の天気 47都道府県</h2>
<div class="content">
<div class="weathergrid" id="weather">天気を取得中...</div>
</div>
<div class="sub" id="weatherStatus">Open-Meteo</div>
</section>

<section class="panel">
<h2>● 世界のニュース</h2>
<div class="content" id="news">ニュースを取得中...</div>
</section>
</main>

<footer>
<div class="label">速報・お知らせ</div>
<div class="tickerWindow"><div class="ticker" id="ticker">情報を取得しています...</div></div>
</footer>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function getJSON(url){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),20000);
 try{
  const r=await fetch(url,{signal:controller.signal});
  if(!r.ok)throw Error("HTTP "+r.status);
  return await r.json();
 }finally{clearTimeout(timer)}
}

const places=[
["北海道",43.06,141.35],["青森",40.82,140.74],["岩手",39.70,141.15],["宮城",38.27,140.87],
["秋田",39.72,140.10],["山形",38.24,140.36],["福島",37.75,140.47],["茨城",36.34,140.45],
["栃木",36.57,139.88],["群馬",36.39,139.06],["埼玉",35.86,139.65],["千葉",35.61,140.12],
["東京",35.68,139.69],["神奈川",35.45,139.64],["新潟",37.90,139.02],["富山",36.70,137.21],
["石川",36.59,136.63],["福井",36.07,136.22],["山梨",35.66,138.57],["長野",36.65,138.18],
["岐阜",35.42,136.76],["静岡",34.98,138.38],["愛知",35.18,136.91],["三重",34.73,136.51],
["滋賀",35.00,135.87],["京都",35.02,135.76],["大阪",34.69,135.50],["兵庫",34.69,135.18],
["奈良",34.69,135.83],["和歌山",34.23,135.17],["鳥取",35.50,134.24],["島根",35.47,133.05],
["岡山",34.66,133.93],["広島",34.40,132.46],["山口",34.19,131.47],["徳島",34.07,134.56],
["香川",34.34,134.04],["愛媛",33.84,132.77],["高知",33.56,133.53],["福岡",33.59,130.40],
["佐賀",33.25,130.30],["長崎",32.75,129.88],["熊本",32.79,130.74],["大分",33.24,131.61],
["宮崎",31.91,131.42],["鹿児島",31.56,130.56],["沖縄",26.21,127.68]
];

const weatherNames={
0:"快晴",1:"晴れ",2:"薄曇",3:"曇り",45:"霧",48:"霧",
51:"霧雨",53:"霧雨",55:"強い霧雨",61:"小雨",63:"雨",65:"大雨",
71:"小雪",73:"雪",75:"大雪",80:"にわか雨",81:"にわか雨",
82:"強い雨",95:"雷雨",96:"雷雨",99:"雷雨"
};

async function loadWeather(){
 try{
  const p=new URLSearchParams();
  p.set("latitude",places.map(x=>x[1]).join(","));
  p.set("longitude",places.map(x=>x[2]).join(","));
  p.set("current","temperature_2m,weather_code");
  p.set("timezone","Asia/Tokyo");
  const result=await getJSON("https://api.open-meteo.com/v1/forecast?"+p);
  const data=Array.isArray(result)?result:[result];
  if(data.length!==47)throw Error("地点データ不一致");
  $("weather").innerHTML=places.map((place,i)=>{
   const c=data[i]?.current;
   if(!c)return `<div class="weather"><div class="pref">${esc(place[0])}</div>--</div>`;
   return `<div class="weather"><div class="pref">${esc(place[0])}</div><div class="temp">${Math.round(c.temperature_2m)}°C</div><div class="condition">${weatherNames[c.weather_code]||"不明"}</div></div>`;
  }).join("");
  $("weatherStatus").textContent="全国47地点 更新 "+new Date().toLocaleTimeString("ja-JP");
 }catch(e){
  console.error(e);
  $("weather").textContent="天気取得エラー: "+e.message;
 }
}

async function loadQuakes(){
 try{
  const data=await getJSON("https://api.p2pquake.net/v2/history?codes=551&limit=20");
  const items=data.filter(x=>x.code===551&&x.earthquake).slice(0,10);
  if(!items.length){
   $("quakes").textContent="表示できる地震情報はありません";
   return;
  }
  const scale={10:"1",20:"2",30:"3",40:"4",45:"5弱",50:"5強",55:"6弱",60:"6強",70:"7"};
  $("quakes").innerHTML=items.map(x=>{
   const e=x.earthquake;
   const name=e.hypocenter?.name||"震源情報なし";
   const intensity=scale[e.maxScale]||"不明";
   return `<div class="item"><b>${esc(name)}</b><br><span class="pill">最大震度 ${intensity}</span><div class="sub">${esc(e.time||x.time||"")}</div></div>`;
  }).join("");
  const first=items[0].earthquake;
  $("ticker").textContent="最新の地震情報："+(first.hypocenter?.name||"震源情報なし")+" ／ 詳細はJQuake・気象庁で確認してください";
 }catch(e){
  console.error(e);
  $("quakes").textContent="地震情報取得エラー: "+e.message;
 }
}

async function loadNews(){
 try{
  const p=new URLSearchParams({
   query:"world",
   mode:"ArtList",
   maxrecords:"15",
   format:"json",
   sort:"DateDesc",
   timespan:"24h"
  });
  const data=await getJSON("https://api.gdeltproject.org/api/v2/doc/doc?"+p);
  const articles=(data.articles||[]).slice(0,15);
  if(!articles.length)throw Error("記事がありません");
  $("news").innerHTML=articles.map(a=>
   `<div class="item"><a style="color:#f3f8ff;text-decoration:none" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a><div class="sub">${esc(a.domain||"")}</div></div>`
  ).join("");
 }catch(e){
  console.error(e);
  $("news").textContent="ニュース取得エラー: "+e.message;
 }
}

loadWeather();
loadQuakes();
loadNews();
setInterval(loadWeather,600000);
setInterval(loadQuakes,60000);
setInterval(loadNews,900000);
</script>
</body>
</html>
