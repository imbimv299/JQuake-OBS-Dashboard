
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JQuake OBS Dashboard</title>
<style>
:root{--bg:#071426;--panel:#102744;--line:#24517a;--blue:#42a5ff;--cyan:#79d8ff;--white:#f3f8ff;--muted:#a9bfd6}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#061323,#0b2440);color:var(--white);font-family:Arial,"Noto Sans JP",sans-serif;overflow:hidden}
.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#0d2745;border-bottom:2px solid var(--blue)}
.brand{font-size:27px;font-weight:800;letter-spacing:.5px}
.brand span{color:var(--cyan)}
.clock{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums}
main{padding:18px;display:grid;grid-template-columns:1.15fr .85fr;gap:16px;height:calc(100vh - 154px)}
.panel{background:linear-gradient(145deg,#102b49,#0b2038);border:1px solid var(--line);border-radius:14px;padding:17px;min-height:0;box-shadow:0 8px 24px #0003}
h2{font-size:19px;margin:0 0 14px;color:var(--cyan);display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;background:#42b5ff;border-radius:50%;box-shadow:0 0 10px #42b5ff}
.quakes{height:100%;overflow:hidden}
.quake{padding:12px 0;border-bottom:1px solid #24425f}
.qrow{display:flex;justify-content:space-between;gap:10px}
.place{font-size:19px;font-weight:700}
.time,.muted{color:var(--muted);font-size:13px}
.meta{margin-top:6px;color:#d8e9fa;font-size:14px}
.intensity{background:#174b78;border-radius:6px;padding:4px 9px;font-weight:800;white-space:nowrap}
.right{display:grid;grid-template-rows:1.25fr 1fr;gap:16px;min-height:0}
.weathergrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-height:calc(100% - 36px);overflow-y:auto;padding-right:4px}
.weatherbox{background:#163655;border-radius:9px;padding:9px;min-width:0}
.wlabel{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wvalue{font-size:20px;font-weight:800;margin-top:4px}
.newslist{overflow:hidden}
.news{padding:11px 0;border-bottom:1px solid #24425f;font-size:15px;line-height:1.45}
.news a{color:var(--white);text-decoration:none}
.news a:hover{color:var(--cyan)}
footer{height:78px;background:#0d2745;border-top:2px solid var(--blue);display:flex;align-items:center;gap:18px;padding:0 22px;overflow:hidden}
.tag{background:#15558b;color:white;padding:8px 12px;border-radius:6px;font-weight:800;white-space:nowrap}
.ticker{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
@media(max-width:800px){
.top{height:60px;padding:0 14px}
.brand{font-size:19px}
.clock{font-size:18px}
main{padding:10px;gap:10px;grid-template-columns:1fr 1fr;height:calc(100vh - 125px)}
.panel{padding:11px}
.place{font-size:15px}
.weathergrid{grid-template-columns:1fr}
.weatherbox{padding:8px}
.wvalue{font-size:19px}
footer{height:65px;padding:0 12px}
.ticker{font-size:14px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">JQuake <span>OBS DASHBOARD</span></div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<main>
  <section class="panel">
    <h2><i class="dot"></i>地震情報</h2>
    <div class="quakes" id="quakes">
      <div class="muted">地震情報を取得しています...</div>
    </div>
  </section>

  <div class="right">
    <section class="panel">
      <h2><i class="dot"></i>全国の天気（47都道府県）</h2>
      <div class="weathergrid" id="weathergrid">
        <div class="muted">全国の天気を取得しています...</div>
      </div>
      <div class="muted" id="weatherdesc" style="margin-top:8px">
        気象データ：Open-Meteo
      </div>
    </section>

    <section class="panel newslist">
      <h2><i class="dot"></i>世界のニュース</h2>
      <div id="news">
        <div class="muted">ニュースを取得しています...</div>
      </div>
    </section>
  </div>
</main>

<footer>
  <div class="tag">速報・お知らせ</div>
  <div class="ticker" id="ticker">地震情報を確認しています...</div>
  <div class="status" id="status">起動中</div>
</footer>

<script>
const $ = id => document.getElementById(id);

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

function updateClock(){
  $("clock").textContent = new Intl.DateTimeFormat("ja-JP", {
    timeZone:"Asia/Tokyo",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).format(new Date());
}

updateClock();
setInterval(updateClock,1000);

const prefectures = [
["北海道",43.06,141.35],
["青森",40.82,140.74],
["岩手",39.70,141.15],
["宮城",38.27,140.87],
["秋田",39.72,140.10],
["山形",38.24,140.36],
["福島",37.75,140.47],
["茨城",36.34,140.45],
["栃木",36.57,139.88],
["群馬",36.39,139.06],
["埼玉",35.86,139.65],
["千葉",35.61,140.12],
["東京",35.68,139.69],
["神奈川",35.45,139.64],
["新潟",37.90,139.02],
["富山",36.70,137.21],
["石川",36.59,136.63],
["福井",36.07,136.22],
["山梨",35.66,138.57],
["長野",36.65,138.18],
["岐阜",35.42,136.76],
["静岡",34.98,138.38],
["愛知",35.18,136.91],
["三重",34.73,136.51],
["滋賀",35.00,135.87],
["京都",35.02,135.76],
["大阪",34.69,135.50],
["兵庫",34.69,135.18],
["奈良",34.69,135.83],
["和歌山",34.23,135.17],
["鳥取",35.50,134.24],
["島根",35.47,133.05],
["岡山",34.66,133.93],
["広島",34.40,132.46],
["山口",34.19,131.47],
["徳島",34.07,134.56],
["香川",34.34,134.04],
["愛媛",33.84,132.77],
["高知",33.56,133.53],
["福岡",33.59,130.40],
["佐賀",33.25,130.30],
["長崎",32.75,129.88],
["熊本",32.79,130.74],
["大分",33.24,131.61],
["宮崎",31.91,131.42],
["鹿児島",31.56,130.56],
["沖縄",26.21,127.68]
];

const weatherLabels = {
0:"快晴",1:"晴れ",2:"薄曇り",3:"曇り",
45:"霧",48:"霧",51:"霧雨",53:"霧雨",
55:"強い霧雨",61:"小雨",63:"雨",65:"大雨",
71:"小雪",73:"雪",75:"大雪",80:"にわか雨",
81:"にわか雨",82:"強い雨",95:"雷雨",
96:"雷雨",99:"雷雨"
};

async function fetchJSON(url,timeoutMs=20000){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(),timeoutMs);

  try{
    const response = await fetch(url,{signal:controller.signal});
    if(!response.ok) throw new Error("HTTP " + response.status);
    return await response.json();
  }finally{
    clearTimeout(timer);
  }
}

async function loadWeather(){
  $("weatherdesc").textContent = "全国の天気を取得中...";

  try{
    const latitudes = prefectures.map(p => p[1]).join(",");
    const longitudes = prefectures.map(p => p[2]).join(",");

    const params = new URLSearchParams();
    params.set("latitude",latitudes);
    params.set("longitude",longitudes);
    params.set("current","temperature_2m,weather_code");
    params.set("timezone","Asia/Tokyo");

    const result = await fetchJSON(
      "https://api.open-meteo.com/v1/forecast?" + params.toString()
    );

    const results = Array.isArray(result) ? result : [result];

    if(results.length !== prefectures.length){
      throw new Error("地点データ数が一致しません");
    }

    $("weathergrid").innerHTML = prefectures.map((pref,index) => {
      const current = results[index] && results[index].current;

      if(!current){
        return '<div class="weatherbox"><div class="wlabel">' +
          escapeHtml(pref[0]) +
          '</div><div class="wvalue">--</div>' +
          '<div class="wlabel">取得失敗</div></div>';
      }

      const label = weatherLabels[current.weather_code] || "天気不明";

      return '<div class="weatherbox"><div class="wlabel">' +
        escapeHtml(pref[0]) +
        '</div><div class="wvalue">' +
        Math.round(current.temperature_2m) +
        '°C</div><div class="wlabel">' +
        label + '</div></div>';
    }).join("");

    $("weatherdesc").textContent =
      "全国47地点・更新 " + new Date().toLocaleTimeString("ja-JP");

  }catch(error){
    console.error("天気取得エラー:",error);
    $("weathergrid").innerHTML =
      '<div class="muted">全国の天気を取得できません。 ' +
      escapeHtml(error.message) + '</div>';
    $("weatherdesc").textContent = "天気情報 未取得";
  }
}

async function loadQuakes(){
  try{
    const data = await fetchJSON(
      "https://api.p2pquake.net/v2/history?codes=551&limit=20&offset=0"
    );

    const quakes = data.filter(item =>
      item && item.code === 551 && item.earthquake
    ).slice(0,8);

    if(!quakes.length){
      $("quakes").innerHTML =
        '<div class="muted">現在、表示できる地震情報はありません。</div>';
      $("ticker").textContent =
        "現在、表示できる地震情報はありません。";
      $("status").textContent = "地震情報 更新 " +
        new Date().toLocaleTimeString("ja-JP");
      return;
    }

    const scaleNames = {
      10:"1",20:"2",30:"3",40:"4",
      45:"5弱",50:"5強",55:"6弱",60:"6強",70:"7"
    };

    $("quakes").innerHTML = quakes.map(item => {
      const earthquake = item.earthquake || {};
      const name = earthquake.hypocenter &&
        earthquake.hypocenter.name
        ? earthquake.hypocenter.name
        : "震源情報なし";

      const scale = earthquake.maxScale;
      const intensity = scaleNames[scale]
        ? "震度 " + scaleNames[scale]
        : "震度情報";

      const time = earthquake.time || item.time || "";
      const type = item.issue && item.issue.type
        ? item.issue.type
        : "地震情報";

      return '<div class="quake"><div class="qrow">' +
        '<div class="place">' + escapeHtml(name) +
        '</div><div class="intensity">' + intensity +
        '</div></div><div class="meta">' + escapeHtml(type) +
        '</div><div class="time">' + escapeHtml(time) +
        '</div></div>';
    }).join("");

    const first = quakes[0];
    const firstName = first.earthquake.hypocenter &&
      first.earthquake.hypocenter.name
      ? first.earthquake.hypocenter.name
      : "震源情報なし";

    $("ticker").textContent =
      "最新の地震情報：" + firstName +
      " ／ 緊急地震速報・津波情報は気象庁などの公式発表も確認してください。";

    $("status").textContent =
      "地震情報 更新 " + new Date().toLocaleTimeString("ja-JP");

  }catch(error){
    console.error("地震取得エラー:",error);
    $("quakes").innerHTML =
      '<div class="muted">地震情報を取得できません。 (' +
      escapeHtml(error.message) + ')</div>';
    $("ticker").textContent =
      "地震情報を取得できません。JQuake・気象庁の公式情報も確認してください。";
    $("status").textContent = "地震情報 未取得";
  }
}

async function loadNews(){
  try{
    const params = new URLSearchParams({
      query:"world",
      mode:"ArtList",
      maxrecords:"7",
      format:"json",
      sort:"DateDesc",
      timespan:"24h"
    });

    const data = await fetchJSON(
      "https://api.gdeltproject.org/api/v2/doc/doc?" +
      params.toString(),
      20000
    );

    const articles = (data.articles || []).slice(0,7);

    if(!articles.length){
      throw new Error("記事がありません");
    }

    $("news").innerHTML = articles.map(article =>
      '<div class="news"><a href="' +
      escapeHtml(article.url || "#") +
      '" target="_blank" rel="noopener noreferrer">' +
      escapeHtml(article.title || "ニュース") +
      '</a><div class="time">' +
      escapeHtml(article.domain || "") +
      '</div></div>'
    ).join("");

  }catch(error){
    console.error("ニュース取得エラー:",error);
    $("news").innerHTML =
      '<div class="muted">ニュースを取得できません。 (' +
      escapeHtml(error.message) + ')</div>';
  }
}

loadWeather();
loadQuakes();
loadNews();

setInterval(loadWeather,10 * 60 * 1000);
setInterval(loadQuakes,60 * 1000);
setInterval(loadNews,15 * 60 * 1000);
</script>
</body>
</html>
